name: Update tzdata

# Rebuild data/ from the latest (or specified) IANA tzdb release.
# Dogfoods cl-stack-http × http-backend-async × event-backend-libuv for the
# download; zic/tar remain the database-build special case.
# Deps via `cl-repo ros` (cl-stack-tzdata/update in the .asd); version via
# `cl-repo version`.

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "tzdb release (e.g. 2026c). Empty = latest."
        required: false
        default: ""
      include_backzone:
        description: "Also compile backzone (pre-1970 extras)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: cl-stack-tzdata-update
  cancel-in-progress: false

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  HTTP_ASYNC_EVENT_BACKEND: libuv
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: Install zic (database build special case)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tzdata

      # cl-repo from the OCI client tree, as the canned cl-repository workflows
      # call it. `ros` installs the cl-stack-tzdata/update dependency set
      # (cl-stack-ssl loads its OpenSSL overlay itself) and starts ros with
      # the source registry configured.
      - name: Rebuild data/ from IANA
        shell: bash
        env:
          INCLUDE_BACKZONE: ${{ inputs.include_backzone == 'true' && '1' || '0' }}
          TZDB_VERSION: ${{ inputs.version }}
        run: |
          cl_repo() {
            CL_REPOSITORY_CLIENT_DIR="$CL_REPOSITORY_DEST" \
              ros +Q -- "${CL_REPOSITORY_CLIENT_DIR%/}/roswell/cl-repo.ros" "$@"
          }
          ARGS=()
          [ -n "$TZDB_VERSION" ] && ARGS+=(-- "$TZDB_VERSION")
          cl_repo ros --system cl-stack-tzdata/update \
            -l scripts/update-tzdata.lisp -q "${ARGS[@]}"

      - name: Regenerate abbreviation index
        shell: bash
        run: ros -l scripts/gen-abbreviations.lisp -q

      # tzdb 2026f -> 2026.6.0. A rebuild of the same release that changes
      # data/ (newer zic, script fix) bumps the package revision: 2026.6.0.1.
      - name: Set .asd :version
        shell: bash
        run: |
          cl_repo() {
            CL_REPOSITORY_CLIENT_DIR="$CL_REPOSITORY_DEST" \
              ros +Q -- "${CL_REPOSITORY_CLIENT_DIR%/}/roswell/cl-repo.ros" "$@"
          }
          VER="$(tr -d '[:space:]' < data/VERSION)"
          YEAR="${VER:0:4}"
          LETTER="${VER:4:1}"
          MINOR=$(( $(printf '%d' "'${LETTER}") - $(printf '%d' "'a") + 1 ))
          RELEASE="${YEAR}.${MINOR}.0"
          # Last token only: a first load may print compile notes on stdout.
          CUR="$(cl_repo version --system cl-stack-tzdata 2>/dev/null \
                 | grep -oE '[0-9]+(\.[0-9]+)*$' | tail -n 1)"
          echo "tzdb=${VER} release=${RELEASE} current=${CUR}"
          if [ "$(echo "$CUR" | cut -d. -f1-3)" != "$RELEASE" ]; then
            cl_repo version "$RELEASE" --system cl-stack-tzdata
          elif [ -n "$(git status --porcelain -- data)" ]; then
            cl_repo version --bump revision --system cl-stack-tzdata
          fi
          git diff -- cl-stack-tzdata.asd

      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.TZDATA_PR_TOKEN }}
          commit-message: "chore: update tzdata"
          title: "chore: update tzdata"
          body: |
            Automated rebuild of `data/` from the latest IANA tzdb release.

            - Download via cl-stack-http × http-backend-async × event-backend-libuv
            - TZif via `zic -b fat` (full history + abbreviations)
            - Alias map from tzdb `Link` lines
            - Abbreviation index regenerated
          branch: tzdata-update
          delete-branch: true
